name: Bug report / 问题反馈
description: Report a reproducible failure without sharing enterprise data.
title: "[Bug]: "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: macOS, WeCom, CLI and bridge versions; repository commit; mark unknown versions as unknown.
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Affected path / 受影响流程
      options:
        - Setup or repository checks
        - CLI probes
        - Expired-permission renewal
        - Pre-expiry desktop experiment (not integrated)
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result / 步骤与预期
      description: Include whether the permission was expired and how you opened the page. Omit bot IDs and private links.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual result and verification / 实际结果与验证
      description: Sanitized error codes, permission states, whether reopening the page or CLI probes confirmed the result. Do not upload raw logs.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前
      options:
        - label: I removed secrets, account identifiers, private URLs and enterprise content.
          required: true
