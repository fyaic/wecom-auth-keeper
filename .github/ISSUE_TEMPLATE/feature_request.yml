name: Feature request / 功能建议
description: Describe the workflow and how success can be verified.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 实际问题
      description: What workflow is blocked, and what is the current workaround?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and acceptance / 方案与验收
      description: Describe desired behavior, environment and evidence that would establish success.
    validations:
      required: true
